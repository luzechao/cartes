name: Deploy to GitHub Pages

# Builds the editor and publishes it at https://<owner>.github.io/<repo>/.
# The app is entirely client-side: files are opened locally in the browser and never uploaded.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The IDD field table is generated from EnergyPlus's IDD files, which are fetched rather than
      # committed. Cached, since they only change when the list of versions does.
      - uses: actions/cache@v6
        with:
          path: idd-cache
          key: idd-${{ hashFiles('scripts/fetch-idd.sh') }}
      - run: npm run fetch-idd
      - run: npm run preprocess-idd

      # The fixture corpus: 126 develop files pinned to one EnergyPlus commit and verified by hash,
      # plus samples from eight releases. EnergyPlus itself is not installed, so the gates that run
      # it skip themselves; everything else — the round-trip and corpus gates included — runs.
      - uses: actions/cache@v6
        with:
          path: test/fixtures
          key: fixtures-${{ hashFiles('scripts/fetch-fixtures.sh', 'test/fixtures/testfiles.manifest') }}
      - run: npm run fetch-fixtures

      - run: npx tsc --noEmit
      - run: npx vitest run

      - run: npx vite build
        env:
          CARTES_BASE: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
